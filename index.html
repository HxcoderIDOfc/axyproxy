<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axynera Gateway | Enterprise API Status</title>
    <style>
        :root {
            --bg-primary: #09090b;
            --bg-card: #121215;
            --bg-card-hover: #18181b;
            --border: #27272a;
            --border-hover: #3f3f46;
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 760px;
        }

        /* Header Style */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .brand h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }

        .brand p {
            font-size: 0.8125rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.08);
            color: var(--success);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6);
            animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* Model Card */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px 24px;
            margin-bottom: 16px;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        .card:hover {
            background-color: var(--bg-card-hover);
            border-color: var(--border-hover);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .model-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .model-name {
            font-size: 0.9375rem;
            font-weight: 600;
        }

        .model-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .metrics-group {
            display: flex;
            gap: 20px;
            text-align: right;
        }

        .metric-val {
            font-size: 0.9375rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .metric-lbl {
            font-size: 0.6875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Canvas Arena */
        .canvas-box {
            width: 100%;
            height: 32px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Footer Simulation Controller */
        .footer-tools {
            margin-top: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }

        .sim-btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            background: var(--border);
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="brand">
                <h1>Axynera Proxy</h1>
                <p>System Live Latency & Availability Monitor</p>
            </div>
            <div class="status-badge">
                <div class="pulse-dot"></div>
                Operational
            </div>
        </div>

        <!-- Model M1 -->
        <div class="card">
            <div class="card-top">
                <div class="model-info">
                    <span class="model-name">Axynity-M1</span>
                    <span class="model-sub">Primary LLM Engine</span>
                </div>
                <div class="metrics-group">
                    <div>
                        <div class="metric-val" id="m1-ping">--</div>
                        <div class="metric-lbl">Latency</div>
                    </div>
                    <div>
                        <div class="metric-val" style="color: var(--success);" id="m1-uptime">100%</div>
                        <div class="metric-lbl">Uptime</div>
                    </div>
                </div>
            </div>
            <div class="canvas-box">
                <canvas id="c-m1"></canvas>
            </div>
        </div>

        <!-- Model Xcode -->
        <div class="card">
            <div class="card-top">
                <div class="model-info">
                    <span class="model-name">Axynity-Xcode</span>
                    <span class="model-sub">Coding Specialized Engine</span>
                </div>
                <div class="metrics-group">
                    <div>
                        <div class="metric-val" id="xcode-ping">--</div>
                        <div class="metric-lbl">Latency</div>
                    </div>
                    <div>
                        <div class="metric-val" style="color: var(--success);" id="xcode-uptime">100%</div>
                        <div class="metric-lbl">Uptime</div>
                    </div>
                </div>
            </div>
            <div class="canvas-box">
                <canvas id="c-xcode"></canvas>
            </div>
        </div>

        <div class="footer-tools">
            <span>Auto-refresh every 1s</span>
            <div class="sim-btn-group">
                <button onclick="injectAnomaly('m1')">Simulate Spike/Error (M1)</button>
                <button onclick="injectAnomaly('xcode')">Simulate Spike/Error (Xcode)</button>
            </div>
        </div>
    </div>

    <script>
        const BLOCKS = 15;
        
        // Status code: 2 = Normal (Hijau), 1 = Warning/High Ping (Kuning), 0 = Error/Down (Merah)
        const modelsData = {
            m1: { statusArr: Array(BLOCKS).fill(2), latencyArr: Array(BLOCKS).fill(45) },
            xcode: { statusArr: Array(BLOCKS).fill(2), latencyArr: Array(BLOCKS).fill(60) }
        };

        function initCanvas(id) {
            const canvas = document.getElementById(id);
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            const ctx = canvas.getContext('2d');
            ctx.scale(2, 2);
            return { ctx, width: rect.width, height: rect.height };
        }

        const cM1 = initCanvas('c-m1');
        const cXcode = initCanvas('c-xcode');

        function renderBlocks(target, statusArr) {
            const { ctx, width, height } = target;
            ctx.clearRect(0, 0, width, height);

            const gap = 5;
            const totalGaps = gap * (BLOCKS - 1);
            const blockW = (width - totalGaps) / BLOCKS;
            const blockH = height;

            statusArr.forEach((val, i) => {
                const x = i * (blockW + gap);

                if (val === 2) {
                    ctx.fillStyle = '#10b981'; // Hijau Normal
                } else if (val === 1) {
                    ctx.fillStyle = '#f59e0b'; // Kuning (Ping Tinggi)
                } else {
                    ctx.fillStyle = '#ef4444'; // Merah (Error)
                }

                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(x, 0, blockW, blockH, 3);
                } else {
                    ctx.rect(x, 0, blockW, blockH);
                }
                ctx.fill();
            });
        }

        function refreshMetrics(key) {
            const data = modelsData[key];
            const currentStatus = data.statusArr[BLOCKS - 1];
            const currentPing = data.latencyArr[BLOCKS - 1];

            const pingEl = document.getElementById(`${key}-ping`);
            const uptimeEl = document.getElementById(`${key}-uptime`);

            // Hitung Uptime persentase (status 2 & 1 dihitung aktif, 0 error)
            const healthyCount = data.statusArr.filter(s => s > 0).length;
            const uptime = Math.round((healthyCount / BLOCKS) * 100);
            uptimeEl.innerText = `${uptime}%`;
            uptimeEl.style.color = uptime >= 80 ? 'var(--success)' : 'var(--error)';

            if (currentStatus === 0) {
                pingEl.innerText = 'ERR';
                pingEl.style.color = 'var(--error)';
            } else if (currentStatus === 1) {
                pingEl.innerText = `${currentPing}ms`;
                pingEl.style.color = 'var(--warning)';
            } else {
                pingEl.innerText = `${currentPing}ms`;
                pingEl.style.color = 'var(--text-main)';
            }
        }

        // Live Tick Loop
        setInterval(() => {
            ['m1', 'xcode'].forEach(key => {
                const data = modelsData[key];
                
                // Simulasi probabilitas: 92% normal (2), 6% ping tinggi (1), 2% error (0)
                const rand = Math.random();
                let newStatus = 2;
                let newPing = Math.floor(30 + Math.random() * 50);

                if (rand > 0.92 && rand <= 0.98) {
                    newStatus = 1; // Kuning (Ping 300ms+)
                    newPing = Math.floor(320 + Math.random() * 180);
                } else if (rand > 0.98) {
                    newStatus = 0; // Merah (Error)
                    newPing = 0;
                }

                data.statusArr.shift();
                data.statusArr.push(newStatus);
                data.latencyArr.shift();
                data.latencyArr.push(newPing);

                if (key === 'm1') renderBlocks(cM1, data.statusArr);
                if (key === 'xcode') renderBlocks(cXcode, data.statusArr);

                refreshMetrics(key);
            });
        }, 1000);

        // Render awal
        renderBlocks(cM1, modelsData.m1.statusArr);
        renderBlocks(cXcode, modelsData.xcode.statusArr);
        refreshMetrics('m1');
        refreshMetrics('xcode');

        // Tombol Simulasi Anomali Manual
        function injectAnomaly(key) {
            modelsData[key].statusArr[BLOCKS - 1] = 0; // Paksa merah
            modelsData[key].latencyArr[BLOCKS - 1] = 0;
            
            if (key === 'm1') renderBlocks(cM1, modelsData.m1.statusArr);
            if (key === 'xcode') renderBlocks(cXcode, modelsData.xcode.statusArr);
            refreshMetrics(key);
        }
    </script>
</body>
</html>
