<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axynera Gateway | Enterprise API Status</title>
    <style>
        :root {
            --bg-primary: #e4e7ec;
            --bg-card: #e4e7ec;
            --shadow-light: #ffffff;
            --shadow-dark: #c5c9d2;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 760px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(197, 201, 210, 0.6);
        }

        .brand h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }

        .brand p {
            font-size: 0.8125rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #e4e7ec;
            color: var(--success);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            background-color: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6);
            animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 16px;
            padding: 24px 28px;
            margin-bottom: 22px;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            transition: all 0.2s ease;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .model-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .model-name {
            font-size: 1rem;
            font-weight: 700;
            color: #111827;
        }

        .model-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .metrics-group {
            display: flex;
            gap: 24px;
            text-align: right;
        }

        .metric-val {
            font-size: 0.9375rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .metric-lbl {
            font-size: 0.6875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .canvas-box {
            width: 100%;
            height: 52px;
            background: #e4e7ec;
            border-radius: 10px;
            padding: 4px 8px;
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            display: flex;
            align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .footer-tools {
            margin-top: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(197, 201, 210, 0.6);
            padding-top: 18px;
            font-weight: 500;
        }

        .live-counter {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
            font-weight: 600;
        }

        .counter-badge {
            background: #e4e7ec;
            color: #0284c7;
            padding: 4px 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.8125rem;
            box-shadow: inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light);
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="brand">
                <h1>Axynera Proxy</h1>
                <p>System Live Latency & Availability Monitor</p>
            </div>
            <div class="status-badge">
                <div class="pulse-dot"></div>
                Operational
            </div>
        </div>

        <div class="card">
            <div class="card-top">
                <div class="model-info">
                    <span class="model-name">Axynity-M1</span>
                    <span class="model-sub">Primary LLM Engine</span>
                </div>
                <div class="metrics-group">
                    <div>
                        <div class="metric-val" id="m1-ping">--</div>
                        <div class="metric-lbl">Latency</div>
                    </div>
                    <div>
                        <div class="metric-val" style="color: var(--success);" id="m1-uptime">100%</div>
                        <div class="metric-lbl">Uptime</div>
                    </div>
                </div>
            </div>
            <div class="canvas-box">
                <canvas id="c-m1"></canvas>
            </div>
        </div>

        <div class="card">
            <div class="card-top">
                <div class="model-info">
                    <span class="model-name">Axynity-Xcode</span>
                    <span class="model-sub">Coding Specialized Engine</span>
                </div>
                <div class="metrics-group">
                    <div>
                        <div class="metric-val" id="xcode-ping">--</div>
                        <div class="metric-lbl">Latency</div>
                    </div>
                    <div>
                        <div class="metric-val" style="color: var(--success);" id="xcode-uptime">100%</div>
                        <div class="metric-lbl">Uptime</div>
                    </div>
                </div>
            </div>
            <div class="canvas-box">
                <canvas id="c-xcode"></canvas>
            </div>
        </div>

        <div class="footer-tools">
            <span>Auto-refresh signal stream</span>
            <div class="live-counter">
                <span>Total Live Requests:</span>
                <span class="counter-badge" id="req-counter">1,543</span>
            </div>
        </div>
    </div>

    <script>
        const BLOCKS = 15;
        let totalRequests = 1543;
        
        // Default semua hijau (2 = Hijau, 1 = Kuning, 0 = Merah)
        const modelsData = {
            m1: { statusArr: Array(BLOCKS).fill(2), latencyArr: Array(BLOCKS).fill(40) },
            xcode: { statusArr: Array(BLOCKS).fill(2), latencyArr: Array(BLOCKS).fill(48) }
        };

        function initCanvas(id) {
            const canvas = document.getElementById(id);
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * 2;
            canvas.height = rect.height * 2;
            const ctx = canvas.getContext('2d');
            ctx.scale(2, 2);
            return { ctx, width: rect.width, height: rect.height };
        }

        const cM1 = initCanvas('c-m1');
        const cXcode = initCanvas('c-xcode');

        function renderBlocks(target, statusArr) {
            const { ctx, width, height } = target;
            ctx.clearRect(0, 0, width, height);

            const gap = 6;
            const totalGaps = gap * (BLOCKS - 1);
            const blockW = (width - totalGaps) / BLOCKS;
            const blockH = height;

            statusArr.forEach((val, i) => {
                const x = i * (blockW + gap);

                if (val === 2) {
                    ctx.fillStyle = '#10b981'; // Hijau
                } else if (val === 1) {
                    ctx.fillStyle = '#f59e0b'; // Kuning
                } else {
                    ctx.fillStyle = '#ef4444'; // Merah
                }

                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(x, 0, blockW, blockH, 5);
                } else {
                    ctx.rect(x, 0, blockW, blockH);
                }
                ctx.fill();
            });
        }

        function refreshMetrics(key) {
            const data = modelsData[key];
            const currentStatus = data.statusArr[BLOCKS - 1];
            const currentPing = data.latencyArr[BLOCKS - 1];

            const pingEl = document.getElementById(`${key}-ping`);
            const uptimeEl = document.getElementById(`${key}-uptime`);

            const healthyCount = data.statusArr.filter(s => s > 0).length;
            const uptime = Math.round((healthyCount / BLOCKS) * 100);
            uptimeEl.innerText = `${uptime}%`;
            uptimeEl.style.color = uptime >= 80 ? 'var(--success)' : 'var(--error)';

            if (currentStatus === 0) {
                pingEl.innerText = 'ERR';
                pingEl.style.color = 'var(--error)';
            } else if (currentStatus === 1) {
                pingEl.innerText = `${currentPing}ms`;
                pingEl.style.color = 'var(--warning)';
            } else {
                pingEl.innerText = `${currentPing}ms`;
                pingEl.style.color = '#1f2937';
            }
        }

        setInterval(() => {
            ['m1', 'xcode'].forEach(key => {
                const data = modelsData[key];
                
                const rand = Math.random();
                let newStatus = 2; // Normal hijau
                let newPing = Math.floor(30 + Math.random() * 25);

                // Peluang kecil terjadi anomali/error di ujung kanan
                if (rand > 0.92 && rand <= 0.97) {
                    newStatus = 1; // Kuning (Ping tinggi)
                    newPing = Math.floor(320 + Math.random() * 100);
                } else if (rand > 0.97) {
                    // ERROR: Nambah 2 bar merah sekaligus di ujung kanan
                    data.statusArr.shift();
                    data.statusArr.push(0);
                    data.latencyArr.shift();
                    data.latencyArr.push(0);

                    data.statusArr.shift();
                    data.statusArr.push(0);
                    data.latencyArr.shift();
                    data.latencyArr.push(0);

                    if (key === 'm1') renderBlocks(cM1, data.statusArr);
                    if (key === 'xcode') renderBlocks(cXcode, data.statusArr);
                    refreshMetrics(key);
                    return;
                }

                // Pergerakan normal (Geser 1 bar ke kanan)
                data.statusArr.shift();
                data.statusArr.push(newStatus);
                data.latencyArr.shift();
                data.latencyArr.push(newPing);

                if (key === 'm1') renderBlocks(cM1, data.statusArr);
                if (key === 'xcode') renderBlocks(cXcode, data.statusArr);

                refreshMetrics(key);
            });

            totalRequests += Math.floor(1 + Math.random() * 4);
            document.getElementById('req-counter').innerText = totalRequests.toLocaleString('id-ID');
        }, 1000);

        renderBlocks(cM1, modelsData.m1.statusArr);
        renderBlocks(cXcode, modelsData.xcode.statusArr);
        refreshMetrics('m1');
        refreshMetrics('xcode');
    </script>
</body>
</html>
